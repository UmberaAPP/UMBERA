[package]
name = "umbera-core"
version = "1.0.0"
edition = "2021"
rust-version = "1.91"
description = "Umbera cryptographic core: post-quantum primitives, MLS group messaging (X-Wing), device linking, call frame keys, message franking."
license = "Apache-2.0"
repository = "https://github.com/UmberaAPP/UMBERA"
homepage = "https://umbera.app"
documentation = "https://docs.rs/umbera-core"
readme = "README.md"
keywords = ["post-quantum", "ml-kem", "mls", "e2ee", "messenger"]
categories = ["cryptography"]

[lib]
name = "umbera_core"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# OpenMLS 0.9.2. The X-Wing cipher suite (MLS_256_XWING_CHACHA20POLY1305_SHA256_Ed25519, code 0x004D from the
# IETF draft) sits behind the draft-ietf-mls-pq-ciphersuites feature; the X-Wing KEM itself comes from
# openmls_libcrux_crypto. The previous suite and all shared primitives still run on RustCrypto (src/provider.rs).
# The stored state format is unchanged from OpenMLS 0.6 (checked by tests/compat_v06.rs).
openmls = { version = "0.9.2", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_rust_crypto = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_libcrux_crypto = { version = "0.4.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_memory_storage = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = "0.6"
openmls_traits = { version = "0.6", features = ["draft-ietf-mls-pq-ciphersuites"] }
tls_codec = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = { version = "0.32.2", features = ["cli"] }
curve25519-dalek = "5"
sha2 = "0.11"
hmac = "0.13"
getrandom = "0.4"
base64 = "0.23"
zeroize = "1"
blake3 = "1"
bs58 = "0.5"
argon2 = "0.6"
pbkdf2 = "0.13"
hkdf = "0.13"
aes-gcm = "0.11"
x25519-dalek = "3"
k256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "zeroize"] }
# FIPS 203 / FIPS 204. hazmat: encapsulate_deterministic, fed 32 fresh bytes from the OS RNG.
ml-kem = { version = "0.3", features = ["hazmat", "zeroize"] }
ml-dsa = { version = "0.1", default-features = false, features = ["alloc", "zeroize"] }
lopdf = { version = "0.47", default-features = false }

# iOS: pure-Rust blake3 (same algorithm and output, no target C compiler needed).
[target.'cfg(target_os = "ios")'.dependencies]
blake3 = { version = "1", features = ["pure"] }

[dev-dependencies]
hex = "0.4"
# The previous core (OpenMLS 0.6, as shipped in the 2.0.x apps) for tests/compat_v06.rs only:
# old and new core run in one test process (saved state, mixed groups). Not part of the library.
openmls_v06 = { package = "openmls", version = "=0.6.0" }
openmls_rust_crypto_v06 = { package = "openmls_rust_crypto", version = "=0.3.0" }
openmls_basic_credential_v06 = { package = "openmls_basic_credential", version = "=0.3.0" }
openmls_traits_v06 = { package = "openmls_traits", version = "=0.3.0" }
tls_codec_v04 = { package = "tls_codec", version = "0.4" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Not panic = "abort": UniFFI turns Rust panics into FFI errors via catch_unwind.
